<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1510">
<title>Life Ledger Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
</style>
<style>
body{background:#050c08;display:flex;justify-content:center}
body>div{flex:none}
@media (max-width:430px){body>div{width:100%!important;height:100dvh!important}}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0a1510;color:#eaf5ee;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;min-height:0;padding:36px 20px 0;display:flex;flex-direction:column;gap:18px;overflow:hidden">

<h1 style="margin:0;font-size:26px;font-weight:700;letter-spacing:-0.3px">Budget</h1>

<div style="height:50px;border-radius:14px;background:#102219;border:1px solid #1b3527;display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<button type="button" aria-label="Previous month" style="width:44px;height:44px;border:0;background:transparent;color:#cfe2d6;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
<span style="font-size:16px;font-weight:600">October 2026</span>
<button type="button" aria-label="Next month" style="width:44px;height:44px;border:0;background:transparent;color:#cfe2d6;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
</div>

<div style="position:relative;display:flex;justify-content:center;align-items:center;height:190px">
<svg role="img" aria-label="37 percent of the monthly budget spent" width="190" height="190" viewBox="0 0 190 190">
<circle cx="95" cy="95" r="76" fill="none" stroke="#16281f" stroke-width="16"/>
<circle cx="95" cy="95" r="76" fill="none" stroke="#4ade80" stroke-width="16" stroke-linecap="round" stroke-dasharray="176.7 477.5" transform="rotate(-90 95 95)"/>
</svg>
<div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
<div style="font-size:28px;font-weight:700;letter-spacing:-0.4px">₱ 5,550</div>
<div style="margin-top:2px;font-size:13px;color:#9bb3a6">of ₱ 15,000</div>
</div>
<div style="position:absolute;right:6px;top:70px;border-radius:12px;background:#102219;border:1px solid #1b3527;padding:8px 10px;text-align:center">
<div style="font-size:15px;font-weight:700">37%</div>
<div style="font-size:11px;color:#9bb3a6">spent</div>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">

<div style="display:flex;align-items:center;gap:12px;background:#102219;border:1px solid #1b3527;border-radius:16px;padding:12px 14px">
<span style="width:44px;height:44px;flex:none;border-radius:13px;background:#f59e42;color:#2b1503;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M7 7h4M17 3c-2 2-2.5 5-2 8h2v10"/></svg></span>
<div style="flex:1;min-width:0">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">Food</span><span style="font-size:13px;color:#cfe2d6;font-weight:600">42%</span></div>
<div style="margin-top:2px;font-size:12px;color:#9bb3a6">₱ 1,250 / ₱ 3,000</div>
<div role="progressbar" aria-label="Food budget used" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" style="margin-top:8px;height:7px;border-radius:4px;background:#1a2e24"><div style="width:42%;height:100%;border-radius:4px;background:#f59e42"></div></div>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;background:#102219;border:1px solid #1b3527;border-radius:16px;padding:12px 14px">
<span style="width:44px;height:44px;flex:none;border-radius:13px;background:#4d82e8;color:#ffffff;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 12h16M7 20l1-3M17 20l-1-3"/></svg></span>
<div style="flex:1;min-width:0">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">Transport</span><span style="font-size:13px;color:#cfe2d6;font-weight:600">40%</span></div>
<div style="margin-top:2px;font-size:12px;color:#9bb3a6">₱ 400 / ₱ 1,000</div>
<div role="progressbar" aria-label="Transport budget used" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="margin-top:8px;height:7px;border-radius:4px;background:#1a2e24"><div style="width:40%;height:100%;border-radius:4px;background:#5b9bf5"></div></div>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;background:#102219;border:1px solid #1b3527;border-radius:16px;padding:12px 14px">
<span style="width:44px;height:44px;flex:none;border-radius:13px;background:#8b6bf0;color:#ffffff;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
<div style="flex:1;min-width:0">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">Shopping</span><span style="font-size:13px;color:#cfe2d6;font-weight:600">45%</span></div>
<div style="margin-top:2px;font-size:12px;color:#9bb3a6">₱ 1,800 / ₱ 4,000</div>
<div role="progressbar" aria-label="Shopping budget used" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" style="margin-top:8px;height:7px;border-radius:4px;background:#1a2e24"><div style="width:45%;height:100%;border-radius:4px;background:#a78bfa"></div></div>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;background:#102219;border:1px solid #1b3527;border-radius:16px;padding:12px 14px">
<span style="width:44px;height:44px;flex:none;border-radius:13px;background:#34d399;color:#04241a;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>
<div style="flex:1;min-width:0">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">Bills</span><span style="font-size:13px;color:#cfe2d6;font-weight:600">42%</span></div>
<div style="margin-top:2px;font-size:12px;color:#9bb3a6">₱ 2,100 / ₱ 5,000</div>
<div role="progressbar" aria-label="Bills budget used" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" style="margin-top:8px;height:7px;border-radius:4px;background:#1a2e24"><div style="width:42%;height:100%;border-radius:4px;background:#4ade80"></div></div>
</div>
</div>

</div>
</div>

<nav aria-label="Main" style="height:76px;flex:none;display:flex;background:#0d1b14;border-top:1px solid #1d3a2b;padding:6px 8px 0;box-sizing:border-box">
<a href="Home.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#4ade80;font-size:11px;font-weight:600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Home</a>
<a href="Transactions.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Transactions</a>
<a href="Goals.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</a>
<a href="Bills.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bills</a>
<a href="Settings.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
</nav>
</div>
</body>
</html>
