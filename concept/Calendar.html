<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1510">
<title>Life Ledger Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
</style>
<style>
body{background:#050c08;display:flex;justify-content:center}
body>div{flex:none}
@media (max-width:430px){body>div{width:100%!important;height:100dvh!important}}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0a1510;color:#eaf5ee;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;min-height:0;padding:36px 20px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden">

<h1 style="margin:0;font-size:26px;font-weight:700;letter-spacing:-0.3px">Calendar</h1>

<div style="background:#102219;border:1px solid #1b3527;border-radius:18px;padding:6px 8px 10px">
<div style="display:flex;align-items:center;justify-content:space-between">
<button type="button" aria-label="Previous month" style="width:44px;height:44px;border:0;background:transparent;color:#cfe2d6;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
<span style="font-size:16px;font-weight:600">October 2026</span>
<button type="button" aria-label="Next month" style="width:44px;height:44px;border:0;background:transparent;color:#cfe2d6;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
</div>

<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;color:#9bb3a6;padding:4px 0 6px">
<span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
</div>

<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px">
<span></span><span></span><span></span><span></span>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">1</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">2</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">3</button>

<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">4</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">5</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">6</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">7</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">8</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">9</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">10</button>

<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">11</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">12</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">13</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">14</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">15</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">16</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">17</button>

<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">18</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">19</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">20</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">21</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">22</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">23</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">24<span style="position:absolute;left:50%;bottom:5px;margin-left:-2px;width:4px;height:4px;border-radius:2px;background:#4ade80"></span></button>

<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">25<span style="position:absolute;left:50%;bottom:5px;margin-left:-2px;width:4px;height:4px;border-radius:2px;background:#4ade80"></span></button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">26<span style="position:absolute;left:50%;bottom:5px;margin-left:-2px;width:4px;height:4px;border-radius:2px;background:#4ade80"></span></button>
<button type="button" aria-pressed="true" style="position:relative;height:46px;border:0;background:#4ade80;color:#06200f;font-size:14px;font-weight:700;cursor:pointer;border-radius:14px;padding:0">27<span style="position:absolute;left:50%;bottom:5px;margin-left:-2px;width:4px;height:4px;border-radius:2px;background:#06200f"></span></button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">28</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">29</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">30</button>
<button type="button" style="position:relative;height:46px;border:0;background:transparent;color:#eaf5ee;font-size:14px;cursor:pointer;border-radius:12px;padding:0">31</button>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between">
<h2 style="margin:0;font-size:17px;font-weight:600">Oct 27, 2026</h2>
<a href="AddTransaction.html" style="display:flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;font-size:14px;font-weight:600;color:#4ade80">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</a>
</div>

<div style="background:#102219;border:1px solid #1b3527;border-radius:16px;padding:2px 14px;display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid #1b3527">
<span style="width:32px;height:32px;border-radius:10px;background:#2dd4bf;color:#032a25;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5h8v2"/></svg></span>
<span style="flex:1;font-size:15px;font-weight:500">Salary</span><span style="font-size:15px;font-weight:700;color:#4ade80">+₱ 15,000</span>
</div>
<div style="display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid #1b3527">
<span style="width:32px;height:32px;border-radius:10px;background:#c98a4b;color:#2b1708;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M9 3v3M13 3v3"/></svg></span>
<span style="flex:1;font-size:15px;font-weight:500">Coffee</span><span style="font-size:15px;font-weight:700;color:#ff7a70">-₱ 150</span>
</div>
<div style="display:flex;align-items:center;gap:12px;min-height:48px">
<span style="width:32px;height:32px;border-radius:10px;background:#ff7a70;color:#2a0a08;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8M7 7h4M17 3c-2 2-2.5 5-2 8h2v10"/></svg></span>
<span style="flex:1;font-size:15px;font-weight:500">Food</span><span style="font-size:15px;font-weight:700;color:#ff7a70">-₱ 120</span>
</div>
</div>
</div>

<nav aria-label="Main" style="height:76px;flex:none;display:flex;background:#0d1b14;border-top:1px solid #1d3a2b;padding:6px 8px 0;box-sizing:border-box">
<a href="Home.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Home</a>
<a href="Transactions.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Transactions</a>
<a href="Goals.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Goals</a>
<a href="Bills.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#9bb3a6;font-size:11px;font-weight:500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bills</a>
<a href="Settings.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#4ade80;font-size:11px;font-weight:600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
</nav>
</div>
</body>
</html>
