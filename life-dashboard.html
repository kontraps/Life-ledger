<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161B22">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* No external fonts — everything works with zero network calls */
  @font-face{font-family:'Display';src:local('Space Grotesk'),local('Avenir Next'),local('Segoe UI');}
</style>
<style>
  :root{
    --bg: #161B22;
    --panel: #1D2430;
    --panel-2: #232B38;
    --ink: #E9E7DF;
    --muted: #8B93A0;
    --line: #2C3542;
    --teal: #4FB8A6;
    --amber: #E8A33D;
    --coral: #E07A5F;
    --violet: #8B7FD1;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, #232C3A 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 40px;}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
  .eyebrow{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  h1{font-family:'Space Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;font-size:26px;margin:4px 0 0;font-weight:700;letter-spacing:-0.01em;}

  /* Quadrant dial — signature element */
  .dial-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
  }
  .dial{flex-shrink:0;}
  .dial-legend{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
  .dial-legend div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .dial-legend b{color:var(--ink);font-weight:500;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:16px;
    overflow:hidden;
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px 12px;
  }
  .card-head h2{
    font-family:'Space Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
    font-size:15px;margin:0;font-weight:600;
    display:flex;align-items:center;gap:9px;
  }
  .tag{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:11px;color:var(--muted);}
  .card-body{padding:0 18px 18px;}

  /* Habits */
  .habit-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 0;border-top:1px solid var(--line);
  }
  .habit-row:first-child{border-top:none;}
  .check{
    width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);
    flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);transition:.15s;
  }
  .check.on{background:var(--teal);border-color:var(--teal);}
  .check.on::after{content:"✓";color:#0F1620;font-size:14px;font-weight:700;}
  .habit-name{flex:1;font-size:14.5px;}
  .streak{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:11.5px;color:var(--amber);}
  .del-x{color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;}

  .add-row{display:flex;gap:8px;margin-top:12px;}
  input, select{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:14px;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    width:100%;
  }
  input::placeholder{color:var(--muted);}
  button.add-btn{
    background:var(--teal);color:#0F1620;border:none;border-radius:9px;
    padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;
  }
  button.add-btn:active{opacity:.8;}

  /* Goals */
  .goal-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .goal-row:first-child{border-top:none;}
  .goal-row.done .goal-text{text-decoration:line-through;color:var(--muted);}
  .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--violet);cursor:pointer;flex-shrink:0;}
  .radio.on{background:var(--violet);}
  .goal-text{flex:1;font-size:14.5px;}

  /* Money */
  .money-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .money-stat{background:var(--panel-2);border-radius:10px;padding:12px 14px;}
  .money-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .money-stat .val{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:19px;margin-top:3px;}
  .val.neg{color:var(--coral);}
  .val.pos{color:var(--teal);}
  .expense-row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .expense-row:first-child{border-top:none;}
  .expense-row .amt{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;color:var(--coral);}

  /* Mood */
  .mood-picker{display:flex;gap:8px;margin-bottom:12px;}
  .mood-opt{
    flex:1;aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);
    background:var(--panel-2);cursor:pointer;font-size:20px;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .mood-opt.on{border-color:var(--amber);background:rgba(232,163,61,.15);transform:scale(1.05);}
  .mood-history{display:flex;gap:4px;align-items:flex-end;height:34px;margin-top:6px;}
  .mood-bar{flex:1;border-radius:3px 3px 0 0;background:var(--violet);opacity:.35;}
  .mood-bar.filled{opacity:1;}

  .empty{color:var(--muted);font-size:13px;padding:10px 0;font-style:italic;}

  footer{text-align:center;margin-top:26px;font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em;}

  /* ---------- Expenses, insights, undo toast ---------- */
  .expense-row{align-items:center;cursor:pointer;}
  .exp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .exp-cat{font-size:11.5px;color:var(--muted);}
  .link-btn{background:none;border:none;color:var(--teal);font-size:13px;font-family:inherit;padding:10px 0 4px;cursor:pointer;}
  .hint{color:var(--muted);font-size:11.5px;padding:6px 0 10px;}

  .sub-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:2px 0 8px;}
  .sub-head:not(:first-child){margin-top:22px;}
  .week-row{display:grid;grid-template-columns:1fr repeat(7,26px);gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);}
  .week-row.week-head{border-top:none;padding:0 0 4px;font-family:'JetBrains Mono','SF Mono','Menlo',monospace;font-size:11px;color:var(--muted);text-align:center;}
  .week-head .today{color:var(--amber);font-weight:700;}
  .week-name{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wd{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);background:var(--panel-2);justify-self:center;}
  .wd.on{background:var(--teal);border-color:var(--teal);}
  .cat-row{margin-top:12px;}
  .cat-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px;}
  .cat-amt{font-family:'JetBrains Mono','SF Mono','Menlo',monospace;color:var(--muted);font-size:12.5px;white-space:nowrap;}
  .bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:4px;}

  #toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px);
    display:flex;align-items:center;gap:14px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:8px 8px 8px 16px;font-size:14px;max-width:calc(100vw - 28px);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:.2s;z-index:10;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  #toastMsg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #toastUndo{background:none;border:none;color:var(--teal);font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;padding:10px 12px;min-height:44px;}

  /* ---------- Mobile optimisation ---------- */
  html{-webkit-text-size-adjust:100%;}
  body{
    min-height:100vh;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button, .check, .radio, .del-x, .mood-opt{touch-action:manipulation;-webkit-user-select:none;user-select:none;}

  /* Respect notch / status bar / home indicator (app is installed full-screen) */
  .wrap{
    padding-top:calc(22px + env(safe-area-inset-top));
    padding-left:calc(18px + env(safe-area-inset-left));
    padding-right:calc(18px + env(safe-area-inset-right));
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }

  /* Expense row: long notes wrap instead of pushing the amount off-screen */
  .expense-row{gap:12px;align-items:center;}
  .exp-note{min-width:0;overflow-wrap:anywhere;}
  .expense-row .amt{white-space:nowrap;}
  .habit-name, .goal-text{min-width:0;overflow-wrap:anywhere;}

  /* Expense form: note on its own line, amount + Log underneath */
  .expense-add{flex-wrap:wrap;}
  .expense-note{flex:1 1 100%;}
  .expense-cat, .expense-amt{flex:1 1 0;min-width:0;}
  .expense-add .add-btn{flex:1 1 100%;min-height:44px;}

  @media (max-width:520px){
    .wrap{
      padding-top:calc(16px + env(safe-area-inset-top));
      padding-left:calc(14px + env(safe-area-inset-left));
      padding-right:calc(14px + env(safe-area-inset-right));
    }
    h1{font-size:24px;}

    /* 16px+ inputs stop iOS Safari zooming the page on focus; 44px = comfortable thumb target */
    input, select{font-size:16px;min-height:44px;padding:10px 12px;}
    button.add-btn{min-height:44px;padding:0 18px;font-size:15px;}

    /* Dial card stacks so the legend isn't squeezed on narrow phones */
    .dial-card{flex-direction:column;align-items:center;gap:16px;padding:18px 16px;}
    .dial-legend{width:100%;}
    .dial-legend div{font-size:13.5px;}

    .card-head{padding:14px 16px 10px;}
    .card-body{padding:0 16px 16px;}

    /* Bigger tap areas (visual size grows a little, hit area grows more via padding) */
    .habit-row{gap:14px;padding:12px 0;}
    .check{width:32px;height:32px;border-radius:9px;}
    .check.on::after{font-size:17px;}
    .habit-name, .goal-text{font-size:16px;}
    .streak{font-size:12px;}
    .del-x{font-size:24px;line-height:1;padding:10px 12px;margin:-10px -8px -10px 0;}

    .goal-row{gap:14px;padding:12px 0;}
    .radio{width:24px;height:24px;position:relative;}
    .radio::before{content:"";position:absolute;inset:-10px;} /* enlarge hit area */

    .money-stat .val{font-size:18px;}
    .expense-row{font-size:14.5px;padding:9px 0;}

    .mood-picker{gap:6px;}
    .mood-opt{font-size:24px;border-radius:12px;}
    .mood-history{height:40px;}

    .week-row{grid-template-columns:1fr repeat(7,22px);gap:4px;}
    .week-name{font-size:15px;}
    .cat-top{font-size:14px;}
    .hint, .link-btn{font-size:13px;}
  }

  @media (max-width:360px){
    .money-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow" id="dateLabel">—</div>
      <h1>Ledger</h1>
    </div>
  </header>

  <div class="dial-card">
    <svg class="dial" id="dialSvg" width="96" height="96" viewBox="0 0 96 96"></svg>
    <div class="dial-legend">
      <div><span class="dot" style="background:var(--teal)"></span>Habits <b id="legHabits">0%</b></div>
      <div><span class="dot" style="background:var(--violet)"></span>Goals <b id="legGoals">0%</b></div>
      <div><span class="dot" style="background:var(--amber)"></span>Budget <b id="legMoney">—</b></div>
      <div><span class="dot" style="background:var(--coral)"></span>Mood <b id="legMood">—</b></div>
    </div>
  </div>

  <!-- HABITS -->
  <div class="card">
    <div class="card-head"><h2>🔥 Habits</h2><span class="tag" id="habitTag">0/0 today</span></div>
    <div class="card-body">
      <div id="habitList"></div>
      <div class="add-row">
        <input id="habitInput" placeholder="New habit, e.g. Drink water" maxlength="40">
        <button class="add-btn" onclick="addHabit()">Add</button>
      </div>
    </div>
  </div>

  <!-- GOALS -->
  <div class="card">
    <div class="card-head"><h2>🎯 Goals</h2><span class="tag" id="goalTag">0 open</span></div>
    <div class="card-body">
      <div id="goalList"></div>
      <div class="add-row">
        <input id="goalInput" placeholder="New goal or task" maxlength="60">
        <button class="add-btn" onclick="addGoal()">Add</button>
      </div>
    </div>
  </div>

  <!-- MONEY -->
  <div class="card">
    <div class="card-head"><h2>💰 Budget</h2><span class="tag">this month</span></div>
    <div class="card-body">
      <div class="money-grid">
        <div class="money-stat"><div class="lbl">Budget</div><div class="val" id="budgetVal">₱0</div></div>
        <div class="money-stat"><div class="lbl">Remaining</div><div class="val" id="remainVal">₱0</div></div>
      </div>
      <div class="add-row" style="margin-bottom:12px;">
        <input id="budgetInput" type="number" inputmode="decimal" enterkeyhint="done" placeholder="Set monthly budget (₱)">
        <button class="add-btn" onclick="setBudget()">Set</button>
      </div>
      <div id="expenseList"></div>
      <div class="add-row expense-add">
        <input id="expenseNote" class="expense-note" enterkeyhint="next" placeholder="What did you spend on?">
        <select id="expenseCat" class="expense-cat" aria-label="Category">
          <option value="food">🍜 Food</option>
          <option value="transport">🚌 Transport</option>
          <option value="bills">🧾 Bills</option>
          <option value="fun">🎮 Fun</option>
          <option value="other">📦 Other</option>
        </select>
        <input id="expenseAmt" class="expense-amt" type="number" inputmode="decimal" enterkeyhint="done" placeholder="₱ Amount">
        <button class="add-btn" onclick="addExpense()">Log</button>
      </div>
    </div>
  </div>

  <!-- MOOD -->
  <div class="card">
    <div class="card-head"><h2>🌤 Mood</h2><span class="tag">today</span></div>
    <div class="card-body">
      <div class="mood-picker" id="moodPicker"></div>
      <div class="mood-history" id="moodHistory"></div>
    </div>
  </div>

  <!-- INSIGHTS -->
  <div class="card">
    <div class="card-head"><h2>📊 Insights</h2><span class="tag" id="insightTag">last 7 days</span></div>
    <div class="card-body">
      <div class="sub-head">Habits this week</div>
      <div id="weekGrid"></div>
      <div class="sub-head">Spending this month</div>
      <div class="money-grid" id="spendStats"></div>
      <div id="catBars"></div>
    </div>
  </div>

  <footer>PRIVATE · SAVED ON THIS DEVICE ONLY</footer>
</div>

<div id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" onclick="doUndo()">Undo</button></div>

<script>
const MOODS = ['😞','😕','😐','🙂','😄'];
// Days use the phone's LOCAL time. (toISOString is UTC, which made the day
// roll over at 8:00 AM in the Philippines instead of midnight.)
const pad2 = n => String(n).padStart(2,'0');
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const monthKey = () => todayKey().slice(0,7);
// Makes typed text safe to show inside the page
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS = {
  food:      {label:'Food',      icon:'🍜', color:'#E8A33D'},
  transport: {label:'Transport', icon:'🚌', color:'#4FB8A6'},
  bills:     {label:'Bills',     icon:'🧾', color:'#8B7FD1'},
  fun:       {label:'Fun',       icon:'🎮', color:'#E07A5F'},
  other:     {label:'Other',     icon:'📦', color:'#8B93A0'}
};
const catOf = key => CATS[key] || CATS.other;
// Philippine peso, with thousands separators (e.g. ₱15,000 or -₱1,250.50)
const peso = (n, dp) => (n<0?'-':'') + '₱' + Math.abs(n).toLocaleString('en-PH',{minimumFractionDigits:dp, maximumFractionDigits:dp});

let state = {
  habits: [],        // {id, name, doneDates: []}
  goals: [],         // {id, text, done}
  budget: { month: monthKey(), amount: 0, expenses: [] }, // expenses: {id, note, amt, cat}
  moodLog: {}        // {dateStr: moodIndex}
};
let showAllExpenses = false;

// Makes sure saved data has every field we need (older versions saved less)
// and starts a fresh month of expenses when the month changes.
function normalize(){
  state.habits = Array.isArray(state.habits) ? state.habits : [];
  state.goals = Array.isArray(state.goals) ? state.goals : [];
  state.moodLog = state.moodLog || {};
  state.habits.forEach(h=>{ if(!Array.isArray(h.doneDates)) h.doneDates = []; });
  const b = state.budget || {};
  const sameMonth = b.month === monthKey();
  state.budget = {
    month: monthKey(),
    amount: Number(b.amount) || 0,
    expenses: (sameMonth && Array.isArray(b.expenses)) ? b.expenses : []
  };
  state.budget.expenses.forEach(e=>{ if(!e.id) e.id = uid(); if(!CATS[e.cat]) e.cat = 'other'; });
}
function load(){
  try{
    const raw = localStorage.getItem('ledger-state');
    if(raw) state = JSON.parse(raw) || state;
  }catch(e){ /* no data yet */ }
  normalize();
  save();
  render();
}
function save(){
  try{ localStorage.setItem('ledger-state', JSON.stringify(state)); }
  catch(e){ console.error('save failed', e); }
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ---------- Undo toast (shown after deleting something) ----------
let toastTimer = null, undoAction = null;
function showToast(msg, undo){
  undoAction = undo;
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>document.getElementById('toast').classList.remove('show'), 6000);
}
function doUndo(){
  if(undoAction){ undoAction(); undoAction = null; }
  clearTimeout(toastTimer);
  document.getElementById('toast').classList.remove('show');
}

// ---------- Habits ----------
function addHabit(){
  const inp = document.getElementById('habitInput');
  const name = inp.value.trim();
  if(!name) return;
  state.habits.push({id: uid(), name, doneDates: []});
  inp.value='';
  save(); render();
}
function toggleHabit(id){
  const h = state.habits.find(x=>x.id===id);
  const t = todayKey();
  const i = h.doneDates.indexOf(t);
  if(i>-1) h.doneDates.splice(i,1); else h.doneDates.push(t);
  save(); render();
}
function deleteHabit(id){
  const idx = state.habits.findIndex(x=>x.id===id);
  if(idx < 0) return;
  const [removed] = state.habits.splice(idx, 1);
  save(); render();
  showToast(`Deleted "${removed.name}"`, ()=>{
    state.habits.splice(Math.min(idx, state.habits.length), 0, removed);
    save(); render();
  });
}
function calcStreak(h){
  const done = new Set(h.doneDates);
  const d = new Date();
  // If today isn't ticked yet, the streak is still alive until midnight, so count from yesterday
  if(!done.has(dateKey(d))) d.setDate(d.getDate()-1);
  let streak = 0;
  while(done.has(dateKey(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

// ---------- Goals ----------
function addGoal(){
  const inp = document.getElementById('goalInput');
  const text = inp.value.trim();
  if(!text) return;
  state.goals.unshift({id: uid(), text, done:false});
  inp.value='';
  save(); render();
}
function toggleGoal(id){
  const g = state.goals.find(x=>x.id===id);
  g.done = !g.done;
  save(); render();
}

function deleteGoal(id){
  const idx = state.goals.findIndex(x=>x.id===id);
  if(idx < 0) return;
  const [removed] = state.goals.splice(idx, 1);
  save(); render();
  showToast(`Deleted "${removed.text}"`, ()=>{
    state.goals.splice(Math.min(idx, state.goals.length), 0, removed);
    save(); render();
  });
}

// ---------- Money ----------
function setBudget(){
  const inp = document.getElementById('budgetInput');
  const v = parseFloat(inp.value);
  if(isNaN(v) || v < 0) return;
  state.budget.amount = v;
  inp.value='';
  save(); render();
}
function addExpense(){
  const note = document.getElementById('expenseNote').value.trim() || 'Expense';
  const amt = parseFloat(document.getElementById('expenseAmt').value);
  if(isNaN(amt) || amt <= 0) return;
  const cat = document.getElementById('expenseCat').value;
  state.budget.expenses.unshift({id: uid(), note, amt, cat});
  document.getElementById('expenseNote').value='';
  document.getElementById('expenseAmt').value='';
  save(); render();
}
function editExpense(id){
  const e = state.budget.expenses.find(x=>x.id===id);
  if(!e) return;
  const input = prompt(`Change amount for "${e.note}" (₱)`, e.amt);
  if(input === null) return;
  const v = parseFloat(String(input).replace(/,/g,''));
  if(isNaN(v) || v <= 0) return;
  e.amt = v;
  save(); render();
}
function deleteExpense(id){
  const list = state.budget.expenses;
  const idx = list.findIndex(x=>x.id===id);
  if(idx < 0) return;
  const [removed] = list.splice(idx, 1);
  save(); render();
  showToast(`Deleted "${removed.note}"`, ()=>{
    state.budget.expenses.splice(Math.min(idx, state.budget.expenses.length), 0, removed);
    save(); render();
  });
}

// ---------- Mood ----------
function setMood(idx){
  state.moodLog[todayKey()] = idx;
  save(); render();
}

// ---------- Render ----------
function render(){
  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});

  // Habits
  const hl = document.getElementById('habitList');
  hl.innerHTML = state.habits.length ? '' : '<div class="empty">No habits yet — add one below.</div>';
  let doneCount=0;
  state.habits.forEach(h=>{
    const isDone = h.doneDates.includes(todayKey());
    if(isDone) doneCount++;
    const streak = calcStreak(h);
    const row = document.createElement('div');
    row.className='habit-row';
    row.innerHTML = `
      <div class="check ${isDone?'on':''}" onclick="toggleHabit('${h.id}')"></div>
      <div class="habit-name">${esc(h.name)}</div>
      <div class="streak">${streak>0?streak+'d streak':''}</div>
      <div class="del-x" onclick="deleteHabit('${h.id}')">×</div>`;
    hl.appendChild(row);
  });
  document.getElementById('habitTag').textContent = `${doneCount}/${state.habits.length} today`;

  // Goals
  const gl = document.getElementById('goalList');
  gl.innerHTML = state.goals.length ? '' : '<div class="empty">No goals yet — add one below.</div>';
  state.goals.forEach(g=>{
    const row = document.createElement('div');
    row.className = 'goal-row'+(g.done?' done':'');
    row.innerHTML = `
      <div class="radio ${g.done?'on':''}" onclick="toggleGoal('${g.id}')"></div>
      <div class="goal-text">${esc(g.text)}</div>
      <div class="del-x" onclick="deleteGoal('${g.id}')">×</div>`;
    gl.appendChild(row);
  });
  const openGoals = state.goals.filter(g=>!g.done).length;
  document.getElementById('goalTag').textContent = `${openGoals} open`;

  // Money
  const spent = state.budget.expenses.reduce((s,e)=>s+e.amt,0);
  const remaining = state.budget.amount - spent;
  document.getElementById('budgetVal').textContent = peso(state.budget.amount, 0);
  const remainEl = document.getElementById('remainVal');
  remainEl.textContent = peso(remaining, 0);
  remainEl.className = 'val ' + (remaining<0?'neg':'pos');
  const el = document.getElementById('expenseList');
  const exps = state.budget.expenses;
  el.innerHTML = exps.length ? '' : '<div class="empty">No expenses logged this month.</div>';
  (showAllExpenses ? exps : exps.slice(0,6)).forEach(e=>{
    const c = catOf(e.cat);
    const row = document.createElement('div');
    row.className='expense-row';
    row.onclick = () => editExpense(e.id);
    row.innerHTML = `
      <div class="exp-main"><span class="exp-note">${esc(e.note)}</span><span class="exp-cat">${c.icon} ${c.label}</span></div>
      <span class="amt">-${peso(e.amt, 2)}</span>
      <div class="del-x" onclick="event.stopPropagation();deleteExpense('${e.id}')">×</div>`;
    el.appendChild(row);
  });
  if(exps.length > 6){
    const more = document.createElement('button');
    more.className = 'link-btn';
    more.textContent = showAllExpenses ? 'Show less' : `Show all ${exps.length}`;
    more.onclick = () => { showAllExpenses = !showAllExpenses; render(); };
    el.appendChild(more);
  }
  if(exps.length){
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Tap an expense to change its amount.';
    el.appendChild(hint);
  }

  // Mood
  const mp = document.getElementById('moodPicker');
  mp.innerHTML='';
  const todayMood = state.moodLog[todayKey()];
  MOODS.forEach((m,i)=>{
    const d = document.createElement('div');
    d.className = 'mood-opt'+(todayMood===i?' on':'');
    d.textContent = m;
    d.onclick=()=>setMood(i);
    mp.appendChild(d);
  });
  const mh = document.getElementById('moodHistory');
  mh.innerHTML='';
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = dateKey(d);
    const val = state.moodLog[key];
    const bar = document.createElement('div');
    bar.className = 'mood-bar'+(val!==undefined?' filled':'');
    bar.style.height = val!==undefined ? (14+val*5)+'px' : '4px';
    if(val!==undefined) bar.style.background = ['#E07A5F','#E8A33D','#8B93A0','#4FB8A6','#8B7FD1'][val];
    mh.appendChild(bar);
  }

  // Dial legend
  const habitPct = state.habits.length ? Math.round(doneCount/state.habits.length*100) : 0;
  const goalPct = state.goals.length ? Math.round(state.goals.filter(g=>g.done).length/state.goals.length*100) : 0;
  document.getElementById('legHabits').textContent = habitPct+'%';
  document.getElementById('legGoals').textContent = goalPct+'%';
  document.getElementById('legMoney').textContent = state.budget.amount>0 ? (remaining>=0?'On track':'Over') : '—';
  document.getElementById('legMood').textContent = todayMood!==undefined ? MOODS[todayMood] : '—';

  drawDial(habitPct, goalPct, state.budget.amount>0?(remaining>=0?100:20):0, todayMood!==undefined?(todayMood+1)*20:0);
  renderInsights();
}

function renderInsights(){
  // --- Habits this week: one row per habit, one square per day (today is the last column) ---
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push({key: dateKey(d), label: d.toLocaleDateString('en-US',{weekday:'narrow'}), today: i===0});
  }
  const wg = document.getElementById('weekGrid');
  const tag = document.getElementById('insightTag');
  if(!state.habits.length){
    wg.innerHTML = '<div class="empty">Add a habit to see your week here.</div>';
    tag.textContent = 'last 7 days';
  }else{
    let doneTotal = 0;
    let html = '<div class="week-row week-head"><span></span>' +
      days.map(d=>`<span class="${d.today?'today':''}">${d.label}</span>`).join('') + '</div>';
    state.habits.forEach(h=>{
      html += `<div class="week-row"><span class="week-name">${esc(h.name)}</span>` +
        days.map(d=>{
          const on = h.doneDates.includes(d.key);
          if(on) doneTotal++;
          return `<span class="wd ${on?'on':''}"></span>`;
        }).join('') + '</div>';
    });
    wg.innerHTML = html;
    tag.textContent = Math.round(doneTotal/(state.habits.length*7)*100) + '% this week';
  }

  // --- Spending this month ---
  const exps = state.budget.expenses;
  const spent = exps.reduce((s,e)=>s+e.amt,0);
  const remaining = state.budget.amount - spent;
  const hasBudget = state.budget.amount > 0;
  const now = new Date();
  const daysLeft = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate() - now.getDate() + 1; // includes today
  const perDay = hasBudget ? Math.max(0, remaining)/daysLeft : 0;
  document.getElementById('spendStats').innerHTML = `
    <div class="money-stat"><div class="lbl">Spent</div><div class="val">${peso(spent,0)}</div></div>
    <div class="money-stat"><div class="lbl">Can spend / day</div><div class="val ${hasBudget?(remaining<0?'neg':'pos'):''}">${hasBudget?peso(perDay,0):'—'}</div></div>`;

  const totals = {};
  exps.forEach(e=>{ const k = CATS[e.cat] ? e.cat : 'other'; totals[k] = (totals[k]||0) + e.amt; });
  const rows = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  document.getElementById('catBars').innerHTML = rows.length ? rows.map(([k,amt])=>{
    const c = CATS[k];
    const pct = spent>0 ? Math.min(100, Math.max(0, Math.round(amt/spent*100))) : 0;
    return `<div class="cat-row">
      <div class="cat-top"><span>${c.icon} ${c.label}</span><span class="cat-amt">${peso(amt,0)} · ${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%;background:${c.color}"></i></div>
    </div>`;
  }).join('') : '<div class="empty">Log an expense to see where your money goes.</div>';
}

function drawDial(habitPct, goalPct, moneyPct, moodPct){
  const svg = document.getElementById('dialSvg');
  const cx=48, cy=48, r=38, sw=9;
  const segs = [
    {pct:habitPct, color:'#4FB8A6'},
    {pct:goalPct, color:'#8B7FD1'},
    {pct:moneyPct, color:'#E8A33D'},
    {pct:moodPct, color:'#E07A5F'}
  ];
  const gap = 6; // degrees gap between segments
  const segAngle = 90 - gap;
  let html = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2C3542" stroke-width="${sw}"/>`;
  segs.forEach((s, idx)=>{
    const startDeg = -90 + idx*90 + gap/2;
    const sweep = segAngle * (s.pct/100);
    if(sweep<=0) return;
    const largeArc = sweep>180?1:0;
    const startRad = startDeg*Math.PI/180;
    const endRad = (startDeg+sweep)*Math.PI/180;
    const x1 = cx + r*Math.cos(startRad), y1 = cy + r*Math.sin(startRad);
    const x2 = cx + r*Math.cos(endRad), y2 = cy + r*Math.sin(endRad);
    html += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  });
  const overall = Math.round((habitPct+goalPct+moneyPct+moodPct)/4);
  html += `<text x="${cx}" y="${cy+2}" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#E9E7DF" font-weight="500">${overall}%</text>`;
  html += `<text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#8B93A0">TODAY</text>`;
  svg.innerHTML = html;
}

// Enter / Go / Done on the phone keyboard submits the field
[['habitInput', addHabit], ['goalInput', addGoal], ['budgetInput', setBudget], ['expenseAmt', addExpense]].forEach(([id, fn])=>{
  document.getElementById(id).addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); fn(); } });
});
document.getElementById('expenseNote').addEventListener('keydown', ev=>{
  if(ev.key==='Enter'){ ev.preventDefault(); document.getElementById('expenseAmt').focus(); }
});

// When you come back to the app (or it's left open past midnight), refresh the day and month
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){ normalize(); save(); render(); }
});

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if unavailable, e.g. viewed locally */ });
  });
}
</script>
